<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Nany Kiss CRM - Retos y Campañas</title>
  
  <!-- 1. Estilos Base / Globales -->
  <link rel="stylesheet" href="dashboard.css">
  
  <!-- 2. Estilos Espefícicos del Módulo Retos -->
  <link rel="stylesheet" href="retos-campanas.css">
</head>
<body>

  <!-- Encabezado Fijo del Módulo -->
  <header class="app-header">
    <h1 class="app-title">🏆 Retos y Campañas</h1>
    <p class="app-subtitle">Nany Kiss CRM</p>
  </header>

  <!-- Contenedor Principal del Módulo -->
  <div class="app-container">
    <main id="nk-module-retos-campanas">
      <!-- El contenido dinámico se renderizará aquí desde retos-campanas.js -->
    </main>
  </div>

  <!-- Barra de Navegación Inferior Fija -->
  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="nav-icon">🏠</span>
      <span>Inicio</span>
    </a>
    <a href="clientes.html" class="nav-item">
      <span class="nav-icon">👥</span>
      <span>Clientes</span>
    </a>
    <a href="retos.html" class="nav-item active">
      <span class="nav-icon">🏆</span>
      <span>Retos</span>
    </a>
    <a href="ajustes.html" class="nav-item">
      <span class="nav-icon">⚙️</span>
      <span>Ajustes</span>
    </a>
  </nav>

  <!-- Script del Motor de Campañas -->
  <script src="retos-campanas.js"></script>

  <!-- Script de Prueba e Integración Segura -->
  <script>
    // Invocaciones de integración desde la Ficha del Cliente
    function demoInvitarCliente(clienteId, campanaId) {
      if (window.NK_EventBus) {
        window.NK_EventBus.emit('CLIENTE:INVITAR_A_CAMPANA', {
          clienteId: clienteId,
          campanaId: campanaId
        });
      } else {
        console.warn('NK_EventBus aún no ha sido inicializado.');
      }
    }

    function demoRegistrarVenta(clienteId, campanaId, monto) {
      if (window.NK_EventBus) {
        window.NK_EventBus.emit('CLIENTE:REGISTRAR_VENTA_CAMPANA', {
          clienteId: clienteId,
          campanaId: campanaId,
          monto: monto
        });
      } else {
        console.warn('NK_EventBus aún no ha sido inicializado.');
      }
    }
  </script>
</body>
</html>
