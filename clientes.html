<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nany Kiss CRM - Clientes</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- ENCABEZADO Y BARRA DE ACCIONES PRINCIPALES -->
    <header class="module-header">
        <div class="header-title">
            <h2><i class="fa-solid fa-users"></i> Módulo de Clientes</h2>
            <p>Centro de operaciones: ventas, cobro, campañas y fidelización</p>
        </div>
        
        <div class="action-buttons">
            <button id="btnRegistrarCompra" class="btn btn-primary" onclick="abrirModalVenta('normal')">
                <i class="fa-solid fa-cart-shopping"></i> Registrar compra
            </button>
            
            <button id="btnRegistrarVentaCampana" class="btn btn-primary btn-campana" onclick="abrirModalVenta('campana')">
                <i class="fa-solid fa-bullhorn"></i> Registrar venta de campaña
            </button>
        </div>
    </header>

    <!-- ÁREA PRINCIPAL: BÚSQUEDA Y TARJETAS -->
    <main class="content-container">
        <section class="search-bar-section">
            <input type="text" id="inputBuscarCliente" class="form-control" placeholder="Buscar cliente por nombre o teléfono..." onkeyup="filtrarClientes()">
        </section>

        <!-- LISTADO DE TARJETAS DE CLIENTE -->
        <section id="listaClientes" class="clientes-grid">
            <!-- Renderizado dinámico desde JavaScript -->
        </section>
    </main>

    <!-- 1. MODAL ÚNICO DE VENTA (COMPRA Y VENTA DE CAMPAÑA) -->
    <div id="modalVenta" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalVentaTitulo"><i class="fa-solid fa-cart-plus"></i> Registrar Venta</h3>
                <button type="button" class="btn-close" onclick="cerrarModalVenta()">&times;</button>
            </div>
            
            <form id="formVenta" onsubmit="guardarVenta(event)">
                <input type="hidden" id="ventaTipoOrigen" value="normal">
                <input type="hidden" id="ventaIdClienteDirecto" value="">
                
                <div class="form-group" id="grupoSelectCliente">
                    <label for="selectCliente">Cliente *</label>
                    <select id="selectCliente" class="form-control">
                        <option value="">Selecciona un cliente...</option>
                    </select>
                </div>

                <!-- CAMPO DINÁMICO: CAMPAÑA (Solo visible para Venta de Campaña) -->
                <div id="grupoCampana" class="form-group hidden">
                    <label for="selectCampana">🏷️ Campaña *</label>
                    <select id="selectCampana" class="form-control">
                        <option value="">Selecciona una campaña activa...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="montoVenta">Monto de la Venta ($) *</label>
                    <input type="number" id="montoVenta" step="0.01" min="0" required class="form-control" placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="conceptoVenta">Detalle o Productos</label>
                    <textarea id="conceptoVenta" class="form-control" rows="3" placeholder="Descripción de los artículos..."></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalVenta()">Cancelar</button>
                    <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Guardar Venta</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 2. MODAL INVITAR A CAMPAÑA (NUEVO) -->
    <div id="modalInvitarCampana" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-paper-plane"></i> Invitar a Campaña</h3>
                <button type="button" class="btn-close" onclick="cerrarModalInvitarCampana()">&times;</button>
            </div>
            
            <form id="formInvitarCampana" onsubmit="procesarInvitacionCampana(event)">
                <input type="hidden" id="invitarIdCliente">
                
                <div class="form-group">
                    <label>Cliente:</label>
                    <input type="text" id="invitarNombreCliente" class="form-control" readonly style="background-color: #f5f5f5;">
                </div>

                <div class="form-group">
                    <label for="selectInvitarCampana">Seleccionar Campaña Activa *</label>
                    <select id="selectInvitarCampana" required class="form-control" onchange="mostrarPrevisualizacionMensaje()">
                        <option value="">Selecciona una campaña...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Vista previa del mensaje a enviar:</label>
                    <textarea id="previewMensajeWhatsApp" class="form-control" rows="4" readonly style="background-color: #f9f9f9; font-size: 13px;"></textarea>
                </div>

                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalInvitarCampana()">Cancelar</button>
                    <button type="submit" class="btn btn-success"><i class="fa-brands fa-whatsapp"></i> Enviar Invitación</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 3. MODAL REGISTRO DE PAGO (EXISTENTE) -->
    <div id="modalPago" class="modal-backdrop hidden">
        <div class="modal-card">
            <div class="modal-header">
                <h3><i class="fa-solid fa-hand-holding-dollar"></i> Registrar Pago</h3>
                <button type="button" class="btn-close" onclick="cerrarModalPago()">&times;</button>
            </div>
            <form id="formPago" onsubmit="guardarPago(event)">
                <input type="hidden" id="pagoIdCliente">
                <div class="form-group">
                    <label>Monto del Abonado ($) *</label>
                    <input type="number" id="montoPago" step="0.01" min="0" required class="form-control" placeholder="0.00">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="cerrarModalPago()">Cancelar</button>
                    <button type="submit" class="btn btn-success"><i class="fa-solid fa-floppy-disk"></i> Guardar Pago</button>
                </div>
            </form>
        </div>
    </div>

    <script src="clientes.js"></script>
</body>
</html>
